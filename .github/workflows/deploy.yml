name: Deploy to Azure Container Apps

# CI-gated deploy to Azure Container Apps. Auth is OIDC (no stored cloud creds).
# One-time provisioning + the GitHub vars/secrets are in docs/INFRA_SETUP.md —
# this workflow does NOT create infrastructure (RG / ACR / env / storage are
# provisioned once by scripts/provision-azure.sh).
#
# The app uses a containerapp.yaml manifest and an existing Azure Files mount.
# App secrets are synced skip-on-unset before the manifest is applied.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel a half-applied prod deploy

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_REPO: voice-ai-workshop
  ACA_NAME: ${{ vars.ACA_NAME }}
  ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml   # no `secrets: inherit`

  build-and-push:
    needs: ci
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute image tag
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          echo "image=${ACR_NAME}.azurecr.io/${ACR_REPO}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name "$ACR_NAME"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App secrets sync — skip-on-unset so a missing source never blanks live
      # config. The manifest references these by secretRef.
      - name: Sync app secrets
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKSHOP_SLIDES_EMBED_URL: ${{ secrets.WORKSHOP_SLIDES_EMBED_URL }}
          HANDOFF_PHONE_NUMBER: ${{ secrets.HANDOFF_PHONE_NUMBER }}
        run: |
          set -euo pipefail
          declare -a secrets=()
          add() { [ -n "$2" ] && secrets+=("$1=$2") || echo "$3 unset — leaving live value untouched."; }
          add twilio-account-sid          "$TWILIO_ACCOUNT_SID"          TWILIO_ACCOUNT_SID
          add twilio-auth-token           "$TWILIO_AUTH_TOKEN"           TWILIO_AUTH_TOKEN
          add twilio-phone-number         "$TWILIO_PHONE_NUMBER"         TWILIO_PHONE_NUMBER
          add openai-api-key              "$OPENAI_API_KEY"              OPENAI_API_KEY
          add workshop-slides-embed-url   "$WORKSHOP_SLIDES_EMBED_URL"   WORKSHOP_SLIDES_EMBED_URL
          add handoff-phone-number        "$HANDOFF_PHONE_NUMBER"        HANDOFF_PHONE_NUMBER
          if [ ${#secrets[@]} -gt 0 ]; then
            az containerapp secret set --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --secrets "${secrets[@]}" >/dev/null
            echo "Synced ${#secrets[@]} secret(s)."
          else
            echo "No secrets to sync."
          fi

      - name: Check call protection setup
        run: |
          set -euo pipefail
          names=$(az containerapp secret list \
            --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --query '[].name' -o tsv)
          for required in call-limit-storage public-base-url admin-password; do
            if ! grep -Fxq "$required" <<< "$names"; then
              echo "::error::Missing Container App secret '$required'. Run scripts/configure-call-protection.sh before deploying."
              exit 1
            fi
          done

      - name: Apply Container App manifest (image via envsubst)
        env:
          APP_NAME: ${{ vars.ACA_NAME }}
          CONTAINER_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          envsubst < .github/containerapp.yaml > /tmp/containerapp.yaml
          az containerapp update \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --yaml /tmp/containerapp.yaml \
            --output none

      # In single-revision mode, the old revision serves the app FQDN until
      # the new one is ready. /health on that FQDN can therefore pass too early.
      - name: Wait for deployed revision
        id: revision
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            state=$(az containerapp show \
              --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --query '{latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,fqdn:properties.latestRevisionFqdn,traffic:properties.configuration.ingress.traffic}' \
              -o json) || state='{}'
            latest=$(jq -r '.latest // empty' <<< "$state")
            ready=$(jq -r '.ready // empty' <<< "$state")
            revision_fqdn=$(jq -r '.fqdn // empty' <<< "$state")
            latest_weight=$(jq -r '([.traffic[]? | select(.latestRevision == true) | .weight] | add) // 0' <<< "$state")
            revision_image=''
            if [ -n "$latest" ]; then
              revision_image=$(az containerapp revision show \
                --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
                --revision "$latest" \
                --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
            fi

            if [ -n "$latest" ] && [ "$latest" = "$ready" ] && \
               [ "$revision_image" = "$IMAGE" ] && [ "$latest_weight" = 100 ] && \
               [ -n "$revision_fqdn" ]; then
              echo "Revision $latest is ready with image $revision_image and 100% traffic."
              echo "fqdn=$revision_fqdn" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $i: latest=${latest:-none}, ready=${ready:-none}, image=${revision_image:-unavailable}, latest traffic=${latest_weight}%; retrying"
            if [ "$i" -lt 45 ]; then sleep 10; fi
          done

          echo "::error::Expected image $IMAGE did not become the ready latest revision with 100% traffic."
          az containerapp show \
            --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --query '{latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,fqdn:properties.latestRevisionFqdn,traffic:properties.configuration.ingress.traffic}' \
            -o json || true
          if [ -n "$latest" ]; then
            az containerapp revision show \
              --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --revision "$latest" \
              --query '{image:properties.template.containers[0].image,health:properties.healthState,provisioning:properties.provisioningState,weight:properties.trafficWeight}' \
              -o json || true
          fi
          exit 1

      - name: Resolve app FQDN
        id: fqdn
        run: |
          FQDN=$(az containerapp show \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$FQDN" ]; then echo "Could not resolve container app FQDN."; exit 1; fi
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test /health
        env:
          FQDN: ${{ steps.fqdn.outputs.fqdn }}
          REVISION_FQDN: ${{ steps.revision.outputs.fqdn }}
        run: |
          set -euo pipefail
          for host in "$REVISION_FQDN" "$FQDN"; do
            for i in $(seq 1 30); do
              code=$(curl --silent --show-error --max-time 10 -o /tmp/health.json \
                -w '%{http_code}' "https://$host/health" || true)
              if [ "$code" = 200 ]; then
                echo "Health OK on $host after attempt $i"
                break
              fi
              echo "Attempt $i on $host: /health returned $code"
              if [ "$i" -eq 30 ]; then
                echo "::error::/health on $host never returned 200 after 30 attempts."
                exit 1
              fi
              sleep 10
            done
          done
          echo "Deployed: https://$FQDN"

      - name: Smoke test voice routes and organizer access
        env:
          FQDN: ${{ steps.fqdn.outputs.fqdn }}
          REVISION_FQDN: ${{ steps.revision.outputs.fqdn }}
        run: |
          set -euo pipefail
          check_routes() {
            local label="$1" origin="$2" attempt twiml_code twiml_ok call_code admin_code verifier_code
            for attempt in $(seq 1 30); do
              twiml_code=$(curl --silent --show-error --max-time 10 -o /tmp/twiml.xml \
                -w '%{http_code}' --request POST "$origin/api/twiml" || true)
              twiml_ok=false
              if [ "$twiml_code" = 200 ] &&
                 grep -Fq '<ConversationRelay' /tmp/twiml.xml &&
                 grep -Fq 'wss://' /tmp/twiml.xml &&
                 grep -Fq '/api/connect-action' /tmp/twiml.xml; then
                twiml_ok=true
              fi

              # Malformed requests stop before a Twilio call or rate-limit reservation.
              call_code=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' \
                --header 'Content-Type: application/json' --data '{}' "$origin/api/call" || true)
              admin_code=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' \
                "$origin/admin" || true)
              # A Builder Codespace calls this route before accepting site-signed /ws.
              verifier_code=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' \
                --header 'Content-Type: application/json' --data '{}' "$origin/api/verify-builder-ws" || true)

              if [ "$twiml_ok" = true ] && [ "$call_code" = 400 ] && \
                 [ "$admin_code" = 401 ] && [ "$verifier_code" = 400 ]; then
                echo "$label voice routes and organizer access passed after attempt $attempt."
                return 0
              fi
              echo "Attempt $attempt on $label: TwiML=$twiml_code expected XML=$twiml_ok, Call Me=$call_code, admin=$admin_code, Builder verifier=$verifier_code"
              if [ "$attempt" -lt 30 ]; then sleep 10; fi
            done
            echo "::error::$label voice routes failed after 30 attempts: TwiML=$twiml_code expected XML=$twiml_ok, Call Me=$call_code, admin=$admin_code, Builder verifier=$verifier_code"
            return 1
          }

          check_routes 'deployed revision' "https://$REVISION_FQDN"
          check_routes 'public app' "https://$FQDN"
